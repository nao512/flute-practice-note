<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f9f8f">
<meta name="description" content="フルートの練習時間や曲目を記録するアプリ">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>フルート練習ノート</title>
<style>
:root{--teal:#0f9f8f;--teal-dark:#087f73;--ink:#24323a;--muted:#687780;--line:#e5eeed;--bg:#f3f8f7;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:850px;margin:auto;padding:16px 14px 38px}
header{background:linear-gradient(120deg,#0f9f8f,#24b89a);color:#fff;border-radius:22px;padding:22px 20px;margin:4px 0 18px;box-shadow:0 8px 22px #0f9f8f20}
h1{font-size:1.35rem;margin:0 0 5px}header p{font-size:.86rem;margin:0;opacity:.94}
.layout{display:grid;grid-template-columns:1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 3px 14px #203b3810}
h2{font-size:1.04rem;margin:0 0 15px;padding-bottom:11px;border-bottom:1px solid var(--line)}
label{display:block;font-size:.88rem;color:#52636b;font-weight:650;margin:12px 0 6px}
input,textarea{width:100%;font:inherit;border:1px solid #d8e4e2;border-radius:12px;padding:12px;background:#fbfdfd;color:var(--ink);min-height:46px}
textarea{min-height:78px;resize:vertical}
button{font:inherit;border:0;border-radius:12px;padding:12px 15px;font-weight:700;cursor:pointer}
.primary{background:var(--teal);color:#fff;width:100%;margin-top:15px}.primary:active{background:var(--teal-dark)}
.secondary{background:#e8f7f4;color:#087f73}.danger{background:#fff0ee;color:#a33c30}.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:#eff9f7;border-radius:14px;padding:13px}.stat small{color:var(--muted);display:block}.stat strong{font-size:1.35rem;color:var(--teal-dark)}
.chart{width:100%;min-height:190px;overflow:hidden}.chart svg{width:100%;height:auto;display:block}
.chart-note{font-size:.78rem;color:var(--muted);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #edf2f1;vertical-align:top}th{font-size:.78rem;color:#718087;white-space:nowrap}td:first-child{white-space:nowrap}td .minutes{display:inline-block;background:#e8f7f4;color:#087f73;padding:4px 7px;border-radius:7px;font-weight:700;white-space:nowrap}
.record-title{font-weight:650;white-space:pre-wrap;overflow-wrap:anywhere}.record-note{font-size:.8rem;color:var(--muted);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.row-actions{display:flex;gap:6px;margin-top:8px}.row-actions button{font-size:.76rem;padding:6px 9px}
.empty{text-align:center;color:var(--muted);padding:25px 8px}
.notice{font-size:.8rem;color:var(--muted);line-height:1.6;margin:12px 2px 0}
footer{text-align:center;color:#83918f;font-size:.76rem;padding:18px 0}
@media(min-width:680px){main{padding:25px 20px 45px}.layout{grid-template-columns:1fr 1fr}.card{padding:21px}header{padding:26px 25px}h1{font-size:1.55rem}}
@media(max-width:430px){th:nth-child(1),td:nth-child(1){display:none}td,th{padding:10px 5px}.card{padding:15px}header{border-radius:18px}}
</style>
</head>
<body>
<main>
<header>
  <h1>🎶 フルート練習ノート</h1>
  <p>今日の積み重ねを、音にしよう。</p>
</header>
<div class="layout">
<section class="card">
<h2>📝 練習を記録</h2>
<form id="practiceForm">
  <input type="hidden" id="editId">
  <label for="dateInput">日付</label>
  <input type="date" id="dateInput" required>
  <label for="durationInput">練習時間（分）</label>
  <input type="number" id="durationInput" min="1" max="1440" inputmode="numeric" placeholder="例：30" required>
  <label for="pieceInput">曲目・練習内容</label>
  <textarea id="pieceInput" maxlength="500" placeholder="例：フォーレ「ファンタジー」、ロングトーン" required></textarea>
  <label for="memoInput">ひとことメモ（任意）</label>
  <input id="memoInput" maxlength="300" placeholder="例：高音が安定してきた">
  <button class="primary" id="saveButton" type="submit">記録を保存する</button>
  <div class="toolbar" style="margin-top:9px"><button class="secondary" type="button" id="cancelEdit" hidden>編集をキャンセル</button></div>
</form>
<p class="notice">記録はこのブラウザのスマホ内に保存されます。同じ端末・同じブラウザでご利用ください。</p>
</section>
<section class="card">
<h2>📊 今週の練習</h2>
<div class="stats">
  <div class="stat"><small>今週の合計</small><strong id="weekMinutes">0分</strong></div>
  <div class="stat"><small>練習した日</small><strong id="weekDays">0日</strong></div>
</div>
<div id="chart" class="chart" aria-label="今週の練習時間グラフ"></div>
<p class="chart-note">月曜日から日曜日まで。1日に複数回記録した場合は合算します。</p>
</section>
</div>
<section class="card" style="margin-top:16px">
<h2>📅 練習の履歴</h2>
<div class="toolbar" style="justify-content:space-between;align-items:center;margin-bottom:10px">
  <span id="recordCount" style="font-size:.85rem;color:var(--muted)">0件</span>
  <div class="toolbar">
    <button type="button" class="secondary" id="exportButton">データを書き出す</button>
    <button type="button" class="danger" id="clearButton">全記録を削除</button>
  </div>
</div>
<div id="history"></div>
<input type="file" id="importInput" accept="application/json,.json" hidden>
<div class="toolbar" style="margin-top:12px"><button type="button" class="secondary" id="importButton">バックアップを読み込む</button></div>
<p class="notice">機種変更やブラウザのデータ削除に備え、ときどき「データを書き出す」でバックアップしてください。書き出したJSONファイルは大切に保管してください。</p>
</section>
<footer>Flute Practice Note · あなたの練習を記録</footer>
</main>
<script>
(() => {
  const KEY = 'flute-practice-notes-v1';
  const $ = id => document.getElementById(id);
  let records = loadRecords();
  function loadRecords(){
    try { const v = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(v) ? v.filter(x => x && x.date && Number(x.duration)>0 && typeof x.piece==='string') : []; }
    catch { return []; }
  }
  function saveRecords(){ localStorage.setItem(KEY, JSON.stringify(records)); }
  function localDate(d=new Date()){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function mondayOf(dateStr){
    const d = new Date(dateStr+'T12:00:00'); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return localDate(d);
  }
  function render(){
    const today=localDate(), monday=mondayOf(today);
    const week=Array.from({length:7},(_,i)=>{const d=new Date(monday+'T12:00:00');d.setDate(d.getDate()+i);return localDate(d)});
    const totals=week.map(day=>records.filter(r=>r.date===day).reduce((s,r)=>s+Number(r.duration),0));
    $('weekMinutes').textContent=totals.reduce((a,b)=>a+b,0)+'分';
    $('weekDays').textContent=totals.filter(v=>v>0).length+'日';
    renderChart(week,totals);
    const sorted=[...records].sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));
    $('recordCount').textContent=records.length+'件';
    if(!sorted.length){$('history').innerHTML='<div class="empty">まだ記録がありません。最初の練習を記録してみましょう。</div>';return;}
    $('history').innerHTML='<div style="overflow-x:auto"><table><thead><tr><th>日付</th><th>時間</th><th>曲目・内容</th></tr></thead><tbody>'+sorted.map(r=>`<tr><td>${escapeHtml(r.date)}</td><td><span class="minutes">${Number(r.duration)}分</span></td><td><div class="record-title">${escapeHtml(r.piece)}</div>${r.memo?`<div class="record-note">${escapeHtml(r.memo)}</div>`:''}<div class="row-actions"><button class="secondary" data-edit="${escapeHtml(r.id)}">編集</button><button class="danger" data-delete="${escapeHtml(r.id)}">削除</button></div></td></tr>`).join('')+'</tbody></table></div>';
  }
  function renderChart(days,values){
    const host=$('chart'), max=Math.max(30,...values), w=350,h=190,left=30,right=8,top=12,bottom=32,plotH=h-top-bottom,plotW=w-left-right;
    const bars=values.map((v,i)=>{const bh=v/max*plotH,x=left+i*(plotW/7)+plotW/7*.19,bw=plotW/7*.62,y=top+plotH-bh;return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,bh)}" rx="4" fill="#18ad9b"/><text x="${x+bw/2}" y="${Math.max(10,y-5)}" font-size="9" text-anchor="middle" fill="#52636b">${v||''}</text><text x="${x+bw/2}" y="${h-12}" font-size="10" text-anchor="middle" fill="#687780">${['月','火','水','木','金','土','日'][i]}</text>`}).join('');
    const grid=[0,.5,1].map(f=>{let y=top+plotH*(1-f);return `<line x1="${left}" y1="${y}" x2="${w-right}" y2="${y}" stroke="#e5eeed" stroke-dasharray="3 3"/>`}).join('');
    host.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="曜日ごとの練習時間（分）">${grid}${bars}</svg>`;
  }
  function resetForm(){ $('editId').value='';$('durationInput').value='';$('pieceInput').value='';$('memoInput').value='';$('saveButton').textContent='記録を保存する';$('cancelEdit').hidden=true; }
  $('dateInput').value=localDate();
  $('practiceForm').addEventListener('submit',e=>{
    e.preventDefault();
    const id=$('editId').value, item={id:id||String(Date.now())+'-'+Math.random().toString(36).slice(2,8),date:$('dateInput').value,duration:Number($('durationInput').value),piece:$('pieceInput').value.trim(),memo:$('memoInput').value.trim(),createdAt:Date.now()};
    if(!item.date||!Number.isFinite(item.duration)||item.duration<1||!item.piece){alert('日付・練習時間・曲目を入力してください。');return;}
    if(id){const idx=records.findIndex(r=>r.id===id);if(idx>=0)records[idx]={...records[idx],...item,id};}
    else records.push(item);
    saveRecords();resetForm();$('dateInput').value=localDate();render();
  });
  $('cancelEdit').addEventListener('click',()=>{resetForm();$('dateInput').value=localDate();});
  $('history').addEventListener('click',e=>{
    const edit=e.target.closest('[data-edit]'), del=e.target.closest('[data-delete]');
    if(edit){const r=records.find(x=>x.id===edit.dataset.edit);if(!r)return;$('editId').value=r.id;$('dateInput').value=r.date;$('durationInput').value=r.duration;$('pieceInput').value=r.piece;$('memoInput').value=r.memo||'';$('saveButton').textContent='変更を保存する';$('cancelEdit').hidden=false;window.scrollTo({top:0,behavior:'smooth'});}
    if(del){const r=records.find(x=>x.id===del.dataset.delete);if(r&&confirm(`「${r.piece}」の記録を削除しますか？`)){records=records.filter(x=>x.id!==r.id);saveRecords();render();}}
  });
  $('clearButton').addEventListener('click',()=>{if(records.length&&confirm('すべての練習記録を削除します。この操作は取り消せません。バックアップはありますか？')){records=[];saveRecords();render();resetForm();$('dateInput').value=localDate();}});
  $('exportButton').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({app:'Flute Practice Note',version:1,records},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='flute-practice-backup-'+localDate()+'.json';a.click();URL.revokeObjectURL(url);});
  $('importButton').addEventListener('click',()=>$('importInput').click());
  $('importInput').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());const incoming=Array.isArray(parsed)?parsed:parsed.records;if(!Array.isArray(incoming))throw new Error('形式');if(!confirm(`${incoming.length}件の記録を読み込みます。現在の記録に追加しますか？`))return;const normalized=incoming.filter(r=>r&&r.date&&Number(r.duration)>0&&typeof r.piece==='string').map(r=>({...r,id:String(r.id||Date.now()+Math.random()),duration:Number(r.duration)}));records=[...records,...normalized];saveRecords();render();alert('読み込みました。');}catch{alert('ファイルを読み込めませんでした。バックアップJSONを選んでください。');}finally{e.target.value='';}});
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
  render();
})();
</script>
</body>
</html>
